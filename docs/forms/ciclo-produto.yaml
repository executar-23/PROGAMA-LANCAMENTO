# Checklist de referência: Product Management, Ciclo de Desenvolvimento de Produto
# Fluxo: Discover -> Define -> Design -> Validate -> Build -> Launch -> Measure -> Learn -> Iterate
# Origem: terceira imagem enviada junto com os dois formulários. Usado como referência de
# fases e perguntas de controle; não substitui os formulários produto.yaml e produto-engenharia.yaml.
schema: ciclo-produto
versao: 1
fases:
  - {n: 1,  fase: Identificação do problema / oportunidade, descricao: "Determinar qual problema merece ser resolvido e por quê.", topicos: [dor do cliente, mercado, negócio, contexto, stakeholders, evidências iniciais], entregaveis: [Problem Statement, oportunidade documentada, stakeholders], perguntas: ["Para quem?", "Qual problema?", "Qual impacto?", "Que evidência existe?"]}
  - {n: 2,  fase: Discovery / Pesquisa, descricao: "Investigar problema, usuário e contexto antes de definir solução.", topicos: [entrevistas, dados, benchmark, jornada, personas/JTBD, hipóteses], entregaveis: [plano de pesquisa, entrevistas/dados, jornada, hipóteses], perguntas: ["O problema é real, frequente e relevante?", "Como é resolvido hoje?"]}
  - {n: 3,  fase: Estratégia de produto, descricao: "Definir direção, valor e resultados esperados.", topicos: [visão, posicionamento, público, proposta de valor, objetivos, métricas], entregaveis: [Product Vision, Value Proposition, objetivos/OKRs, KPIs], perguntas: ["Por que este produto?", "Para quem?", "Qual diferencial?", "Como o sucesso será medido?"]}
  - {n: 4,  fase: Priorização, descricao: "Escolher problemas e oportunidades de maior valor.", topicos: [RICE, ICE, MoSCoW, Value x Effort, impacto, risco, dependências], entregaveis: [backlog priorizado, critérios registrados, decisão de escopo], perguntas: ["Qual item gera maior impacto?", "Custo?", "Risco?", "Urgência?"]}
  - {n: 5,  fase: Definição da solução, descricao: "Transformar problema validado em solução executável.", topicos: [requisitos, UX, fluxos, arquitetura funcional, MVP, protótipos], entregaveis: [PRD, fluxos, protótipo, escopo do MVP, critérios de aceite], perguntas: ["Qual é o mínimo necessário?", "O que fica fora?"]}
  - {n: 6,  fase: Validação, descricao: "Reduzir risco antes do desenvolvimento completo.", topicos: [testes de usabilidade, protótipos, experimentos, entrevistas, viabilidade], entregaveis: [plano de teste, resultados, evidências, decisão Go/No-Go], perguntas: ["O usuário entende e usa?", "O valor foi comprovado?"]}
  - {n: 7,  fase: Delivery / Desenvolvimento, descricao: "Construir e garantir qualidade da solução.", topicos: [engenharia, design, QA, refinamento, sprints, segurança, implementação], entregaveis: [backlog técnico, release candidate, QA aprovado, documentação], perguntas: ["Critérios atendidos?", "Riscos resolvidos?", "Pronto para produção?"]}
  - {n: 8,  fase: Lançamento / Go-to-Market, descricao: "Disponibilizar produto e preparar a operação comercial.", topicos: [release, comunicação, marketing, vendas, onboarding, suporte, treinamento], entregaveis: [GTM Plan, release notes, documentação, suporte preparado], perguntas: ["Quem lança?", "Para quem?", "Quando?", "Como comunicar?"]}
  - {n: 9,  fase: Medição, descricao: "Verificar comportamento e resultados reais.", topicos: [adoção, ativação, retenção, receita, satisfação, qualidade, funil], entregaveis: [dashboard, KPIs, baseline, relatório pós-lançamento], perguntas: ["Objetivos foram atingidos?", "Onde há abandono?"]}
  - {n: 10, fase: Aprendizado e otimização, descricao: "Converter dados e feedback em melhorias.", topicos: [feedback, analytics, bugs, experimentos, análise de causa, iteração], entregaveis: [insights, backlog de melhorias, decisões documentadas], perguntas: ["O que funcionou?", "O que falhou?", "O que mudar?"]}
  - {n: 11, fase: Growth / Escala, descricao: "Ampliar crescimento sustentável do produto.", topicos: [aquisição, ativação, retenção, monetização, referral, expansão], entregaveis: [growth backlog, experimentos, métricas AARRR], perguntas: ["Qual alavanca limita o crescimento?", "É escalável?"]}
  - {n: 12, fase: Maturidade / Manutenção, descricao: "Sustentar qualidade, eficiência e rentabilidade.", topicos: [performance, estabilidade, dívida técnica, custos, segurança, melhorias incrementais], entregaveis: [SLA/SLO, roadmap técnico, plano de manutenção], perguntas: ["O produto permanece competitivo, seguro e rentável?"]}
  - {n: 13, fase: Evolução / Pivot / Descontinuação, descricao: "Decidir o futuro do produto com base em evidências.", topicos: [renovação, reposicionamento, pivot, substituição, sunset, migração], entregaveis: [Lifecycle Review, decisão executiva, plano de transição], perguntas: ["Investir, manter, pivotar ou encerrar?", "Por quê?"]}
